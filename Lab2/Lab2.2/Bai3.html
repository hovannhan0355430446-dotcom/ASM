<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lesson 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 650px;
            border: 2px solid #5a9e3f;
            text-align: center;
        }

        th, td {
            border: 1px solid #5a9e3f;
            padding: 10px;
        }

        /* Dòng tiêu đề đầu tiên */
        .header-row {
            background-color: #5a9e3f;
            color: black;
            font-weight: bold;
        }

        /* Dòng tiêu đề phụ (Vòng chung kết U19...) */
        .sub-header {
            background-color: #e2f0d9;
            font-weight: bold;
            font-size: 16px;
        }

        /* Ô Trận đấu căn 2 đội 2 bên */
        .match-cell {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Chữ màu đỏ in đậm */
        .red-text {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <table border="1", style = "table-layout: fixed;">
        <!-- Dòng 1: Tiêu đề các cột -->
        <tr class="header-row">
            <th style="width: 25%;">Thời gian</th>
            <th style="width: 55%;">Trận đấu</th>
            <th style="width: 20%;">Trực tiếp</th>
        </tr>

        <!-- Dòng 2: Tiêu đề gộp 3 cột (colspan="3") -->
        <tr class="sub-header">
            <td colspan="3">Vòng chung kết U19 châu Á 2016</td>
        </tr>

        <!-- Trận 1 -->
        <tr>
            <td>17/10<br>20:30</td>
            <td>
                <div class="match-cell">
                    <span class="red-text">U19 Việt Nam</span>
                    <span>U19 UAE</span>
                </div>
            </td>
            <td class="red-text">Foxsports2</td>
        </tr>

        <!-- Trận 2 -->
        <tr>
            <td>17/10<br>20:30</td>
            <td>
                <div class="match-cell">
                    <span>U19 Iran</span>
                    <span>U19 Nhật Bản</span>
                </div>
            </td>
            <td></td>
        </tr>

        <!-- Trận 3 -->
        <tr>
            <td>17/10<br>23:30</td>
            <td>
                <div class="match-cell">
                    <span>U19 Iraq</span>
                    <span>U19 Triều Tiên</span>
                </div>
            </td>
            <td></td>
        </tr>

        <!-- Trận 4 -->
        <tr>
            <td>17/10<br>23:30</td>
            <td>
                <div class="match-cell">
                    <span>U19 Yemen</span>
                    <span>U19 Qatar</span>
                </div>
            </td>
            <td></td>
        </tr>
    </table>

</body>
</html>
