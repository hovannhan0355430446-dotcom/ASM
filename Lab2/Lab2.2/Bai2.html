<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2: Thiết kế form đăng ký</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        form {
            max-width: 400px;
        }
        /* Viết hoa và in đậm các tiêu đề mục */
        .label-title {
            font-weight: bold;
            text-transform: uppercase;
        }
        /* Căn chỉnh kích thước ô nhập cho đều và đẹp */
        input[type="text"], select, textarea {
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <form action="" method="POST">
        <!-- 1. HỌ VÀ TÊN -->
        <label class="label-title" for="fullname">Họ và tên:</label><br>
        <input type="text" id="fullname" name="fullname"><br><br>

        <!-- 2. GIỚI TÍNH (chọn sẵn Nam) -->
        <span class="label-title">Giới tính:</span>
        <input type="radio" id="nam" name="gender" value="Nam" checked>
        <label for="nam">Nam</label>
        <input type="radio" id="nu" name="gender" value="Nữ">
        <label for="nu">Nữ</label><br><br>

        <!-- 3. HÌNH ẢNH -->
        <label class="label-title" for="avatar">Hình ảnh:</label><br>
        <input type="file" id="avatar" name="avatar"><br><br>

        <!-- 4. QUỐC TỊCH -->
        <label class="label-title" for="nationality">Quốc tịch:</label><br>
        <select id="nationality" name="nationality">
            <option value="United States">United States</option>
            <option value="Vietnam">Việt Nam</option>
            <option value="Japan">Japan</option>
            <option value="Korea">Korea</option>
        </select><br><br>

        <!-- 5. SỞ THÍCH (chọn sẵn Du lịch) -->
        <span class="label-title">Sở thích:</span><br>
        <input type="checkbox" id="thethao" name="hobby" value="Thể thao">
        <label for="thethao">Thể thao</label>

        <input type="checkbox" id="dulich" name="hobby" value="Du lịch" checked>
        <label for="dulich">Du lịch</label>

        <input type="checkbox" id="amnhac" name="hobby" value="Âm nhạc">
        <label for="amnhac">Âm nhạc</label>

        <input type="checkbox" id="amthuc" name="hobby" value="Ẩm thực">
        <label for="amthuc">Ẩm thực</label><br><br>

        <!-- 6. GHI CHÚ -->
        <label class="label-title" for="notes">Ghi chú:</label><br>
        <textarea id="notes" name="notes" rows="4"></textarea><br><br>

        <!-- Đường kẻ ngang -->
        <hr align="left">

        <!-- NÚT BẤM -->
        <button type="submit">Đăng ký</button>
        <button type="reset">Nhập lại</button>
    </form>

</body>
</html>
