<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ví dụ về a href và a name</title>
    <style>
        .content {
            background-color: #f9f9f9;
        }
        /* Căn giữa và tạo khoảng cách đẹp cho ảnh */
        .album {
            text-align: center;
        }
        .album img {
            margin: 5px;
            object-fit: cover; /* Giúp ảnh không bị méo */
        }
    </style>
</head>
<body>
    <div class="album">
        <h1> ALBUM ẢNH </h1> <br> <br>
        <hr>
        <!-- Vì ảnh nằm cùng thư mục với file HTML nên chỉ cần gọi tên ảnh và thêm dấu ngoặc kép "" -->
        <img src="img1.png" width="300" height="200">
        <img src="img2.png" width="300" height="200">
        <img src="img3.png" width="300" height="200"><br><hr>
        <img src="img4.png" width="300" height="200">
        <img src="img5.png" width="300" height="200">
        <img src="img6.png" width="300" height="200"><br><hr>
    </div>
</body>
</html>
